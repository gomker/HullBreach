// HullBreach 1.8 - ModuleManager patches (BDArmory Plus, BDArmoryExtended, Refurbished Armory)
// Generated for KSP 1.12.5 + BDArmory 1.13. Every patch is guarded with :NEEDS so it is inert when
// the pack is not installed, skips parts that already carry ModuleHullBreach (pack-supplied configs
// win), and runs in :LAST[HullBreach] so parts added or renamed by other patches are covered.
//
// Roles:
//   hull = true         watertight compartment, floods from BDArmory damage below the waterline
//   submarine = true    pressure hull: marks the vessel as a submarine (also detected from the
//                       BDA Surface AI in Submarine mode)
//   crushable = true    superstructure/weapon: loses buoyancy once its ship founders
//   hydroExplosive      magazine/turret that cooks off if it goes under with a foundered ship
//   subdivision = 2     single-part ships: light damage floods a small share of the hull
//   crushDepth          metres; submarines are never crushed above submarineMinCrushDepth (350 m)

// BDArmory: naval CIWS, radars, sonar
@PART[bahaGoalKeeper|GoalKeeperBDAcMk1|BDAcGKmk2|bahaOMillennium|scanLockRadar1|scanLargeRadar|BDAsonarPod1A]:HAS[!MODULE[ModuleHullBreach]]:NEEDS[BDArmory]:LAST[HullBreach]
{
	MODULE
	{
		name = ModuleHullBreach
		crushable = true
		crushDepth = 100
	}
}

// BDArmory: armour plates (as in HullBreach 1.7)
@PART[BD_PanelArmor*|BD*panelArmor|BD*slopeArmor]:HAS[!MODULE[ModuleHullBreach]]:NEEDS[BDArmory]:LAST[HullBreach]
{
	MODULE
	{
		name = ModuleHullBreach
		crushable = true
		crushDepth = 200
	}
}

// BDArmoryExtended: naval guns, CIWS, missile turrets, torpedo launcher, sonar
@PART[baha100mmTurret|baha130mmTurret|baha37mmCIWS|baha37mmTurret|baha57mmTurret|baha76mmTurret|bahaAPS|bahaCIMS|bahaGMLR|bahaSingleGMLR|bahaSmallMissileTurret|baha_Torplauncher|BDAsonarPod1B]:HAS[!MODULE[ModuleHullBreach]]:NEEDS[BDArmoryExtended]:LAST[HullBreach]
{
	MODULE
	{
		name = ModuleHullBreach
		crushable = true
		crushDepth = 100
	}
}

// Refurbished Armory: naval radars, Phalanx, RAM/SeaRAM, Mk29, CB90
@PART[APARradar|APARradarLarge|smartsradar|STIRradar|Talosradar|thephalanx|RAMLauncherTurret|SEARAMLauncherTurret|MK29Launcher|CB90MissileLuncher]:HAS[!MODULE[ModuleHullBreach]]:NEEDS[BDArmoryRefurbished]:LAST[HullBreach]
{
	MODULE
	{
		name = ModuleHullBreach
		crushable = true
		crushDepth = 100
	}
}

// Refurbished Armory: legacy part names from older releases (no-op when absent)
@PART[theotomelara76compact|MK41VLSQUAD|MK41VLSINGLE]:HAS[!MODULE[ModuleHullBreach]]:NEEDS[BDArmoryRefurbished]:LAST[HullBreach]
{
	MODULE
	{
		name = ModuleHullBreach
		crushable = true
		crushDepth = 100
	}
}
