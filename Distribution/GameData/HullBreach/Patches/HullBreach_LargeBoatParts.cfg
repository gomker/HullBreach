// HullBreach 1.8 - ModuleManager patches (Large Boat Parts Pack)
// Generated for KSP 1.12.5 + BDArmory 1.13. Every patch is guarded with :NEEDS so it is inert when
// the pack is not installed, skips parts that already carry ModuleHullBreach (pack-supplied configs
// win), and runs in :LAST[HullBreach] so parts added or renamed by other patches are covered.
//
// Roles:
//   hull = true         watertight compartment, floods from BDArmory damage below the waterline
//   submarine = true    pressure hull: marks the vessel as a submarine (also detected from the
//                       BDA Surface AI in Submarine mode)
//   crushable = true    superstructure/weapon: loses buoyancy once its ship founders
//   hydroExplosive      magazine/turret that cooks off if it goes under with a foundered ship
//   subdivision = 2     single-part ships: light damage floods a small share of the hull
//   crushDepth          metres; submarines are never crushed above submarineMinCrushDepth (350 m)

// Modern hulls
@PART[CVHalfHull|CarrierHangarHull|CarrierShortStern|CarrierStorageHangarHull|DG10KBow|DG10Kstern|DGfwdHangar|DGhangarLftHull|MedBowRevB|MedHullLCSModule2|MedLCSmodule1|MedLCSmodule1B|carrierShortBow|carriermbow|carriermhull|carriermstern|mediumbow|mediumhelostern|mediumhull|mediumhullshort|mediumhullshortvls|mediumstern|mediumsternHangarLong|mediumsternHangarShort|mediumtumbow|smallbow|smallhull|smallhullshort|smallstern|tribow|trihull|trihullshort|trimaranShortBow|tumblebow|TriLCSHull]:HAS[!MODULE[ModuleHullBreach]]:NEEDS[LShipPartsModern]:LAST[HullBreach]
{
	MODULE
	{
		name = ModuleHullBreach
		hull = true
		crushDepth = 200
	}
}

// Modern submarine pressure hulls
@PART[subbow|subhull|subhullshort|subhullstern|SubHullVLSshort|SubHullMFWvls]:HAS[!MODULE[ModuleHullBreach]]:NEEDS[LShipPartsModern]:LAST[HullBreach]
{
	MODULE
	{
		name = ModuleHullBreach
		hull = true
		submarine = true
		crushDepth = 400
	}
}

// Submarine sail / deck platform
@PART[subtower|subplatform]:HAS[!MODULE[ModuleHullBreach]]:NEEDS[LShipPartsModern]:LAST[HullBreach]
{
	MODULE
	{
		name = ModuleHullBreach
		crushable = true
		submarine = true
		crushDepth = 400
	}
}

// Modern superstructure, hangars, VLS blocks, lifts
@PART[DGBridgeBase|DGHangar|DGHangar2|DGSuperBack|DGSuperFront|DGSuperMid|DGdeckHangar|ModernSuperMFVLS|ModernSuperVLS|VetteCargoCell|VetteHullVLSshort|VetteSuperOpen|VetteUpperCargo|modernsuperback|modernsuperflat|modernsuperfront|modernsuperfrontcut|modernsupermiddle|modernsupertall|shipsupers|smallsupcut|smallsupfront|smallsupmid|smalltower|vetteHangar|vetteTower2|vetteTower3Lit|vetteTower3lit|CarrierLiftLong|CarrierLiftShort]:HAS[!MODULE[ModuleHullBreach]]:NEEDS[LShipPartsModern]:LAST[HullBreach]
{
	MODULE
	{
		name = ModuleHullBreach
		crushable = true
		crushDepth = 100
	}
}

