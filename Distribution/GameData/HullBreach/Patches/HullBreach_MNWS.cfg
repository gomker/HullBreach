// HullBreach 1.8 - ModuleManager patches (MNWS - Modern Naval Weapon Systems)
// Generated for KSP 1.12.5 + BDArmory 1.13. Every patch is guarded with :NEEDS so it is inert when
// the pack is not installed, skips parts that already carry ModuleHullBreach (pack-supplied configs
// win), and runs in :LAST[HullBreach] so parts added or renamed by other patches are covered.
//
// Roles:
//   hull = true         watertight compartment, floods from BDArmory damage below the waterline
//   submarine = true    pressure hull: marks the vessel as a submarine (also detected from the
//                       BDA Surface AI in Submarine mode)
//   crushable = true    superstructure/weapon: loses buoyancy once its ship founders
//   hydroExplosive      magazine/turret that cooks off if it goes under with a foundered ship
//   subdivision = 2     single-part ships: light damage floods a small share of the hull
//   crushDepth          metres; submarines are never crushed above submarineMinCrushDepth (350 m)

// Single-part warships and carriers
@PART[055A|055X1|075A|065|CGX065|AMB|AMBII|CGNX2050|CVN003|CVN004|CVN16|CVN21|DDG030|FDG057|FDG060|MSWS111]:HAS[!MODULE[ModuleHullBreach]]:NEEDS[Johnny]:LAST[HullBreach]
{
	MODULE
	{
		name = ModuleHullBreach
		hull = true
		subdivision = 2
		crushDepth = 200
	}
}

// Single-part ballistic missile submarine
@PART[SSBN002]:HAS[!MODULE[ModuleHullBreach]]:NEEDS[Johnny]:LAST[HullBreach]
{
	MODULE
	{
		name = ModuleHullBreach
		hull = true
		submarine = true
		subdivision = 2
		crushDepth = 400
	}
}

// Naval turrets, launchers, VLS cells, radars ('DDG2002 RAIL' has a space: matched with ?)
@PART[AAMS|AAMSL|AAMSLM|AAMSR|AS_ML|AVLS11|AVLS22|AVLS33|AVLSX1|AVLSX2|AVLSX3|DDG2002?RAIL|FRADAR|HHQXL|HHQXL2|HHQXX|LLauncher|YUXX|MK58L|MLX|MLX2|MMB|MSWSM4X|MSWSWT|MSWSWT1|MSWSWT2|MSWSWT3|MSWSWT4|MissleCell2050|RGBB|RML|SAAM]:HAS[!MODULE[ModuleHullBreach]]:NEEDS[Johnny]:LAST[HullBreach]
{
	MODULE
	{
		name = ModuleHullBreach
		crushable = true
		crushDepth = 100
	}
}
