// HullBreach 1.8 resources.
//
// SeaWater is the flood water. HullBreach adds it at runtime to damaged hull parts (no part needs a
// SeaWater RESOURCE in its config any more); ALL_VESSEL/PUMP flow lets the Large Sea Water Pump, or
// any other converter that consumes SeaWater, bail out every compartment of the vessel.
RESOURCE_DEFINITION
{
	name = SeaWater
	displayName = Sea Water
	abbreviation = SW
	density = 1.00
	unitCost = 0
	hsp = 4183
	flowMode = ALL_VESSEL
	transfer = PUMP
	isTweakable = false
	isVisible = true
}

// BallastWater is provided by Large Boat Parts Pack (LShipPartsRequired / SM_Industries), KerbalField and
// MNWS (Johnny). Only define it when none of them is installed, to avoid duplicate definitions.
RESOURCE_DEFINITION:NEEDS[!KerbalField&!SM_Industries&!Johnny&!LShipPartsRequired]
{
	name = BallastWater
	density = 1.00
	unitCost = 0
	hsp = 4183
	flowMode = ALL_VESSEL
	transfer = PUMP
	isTweakable = true
}
