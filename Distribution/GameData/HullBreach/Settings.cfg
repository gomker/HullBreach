// HullBreach 1.8 global settings (defaults). Change them here, with a ModuleManager patch
// (@HullBreachSettings { @floodTime = 90 }), or in flight from the toolbar window; "Save" in that
// window writes GameData/HullBreach/PluginData/settings.cfg, which overrides this file.
HullBreachSettings
{
	enabled = True
	// Seconds to flood a whole compartment at 100% damage, near the surface (larger = slower sinking)
	floodTime = 60
	// Damage severity (0..1, from BDArmory hitpoint and armour loss) at which a hull starts leaking
	breachThreshold = 0.1
	// Severity at which the whole compartment is open to the sea (critical breach)
	criticalThreshold = 0.6
	// Extra flooding allowed past critical (water over the deck / progressive flooding)
	criticalOverfill = 0.2
	// Weight of armour loss in the severity (0 = hitpoints only)
	armorWeight = 0.35
	// Global multiplier on all inflow
	globalFlowMultiplier = 1
	// Drain speed, relative to inflow, when a compartment holds more water than its waterline level
	drainFactor = 0.5
	// Submarine damage control: fraction of a compartment's capacity pumped per second while a breach is not critical
	submarineDamageControlRate = 0.002
	// Depth scaling of inflow: sqrt((depth + 1) / refDepth), clamped to [minDepthFactor, maxDepthFactor]
	refDepth = 4
	minDepthFactor = 0.5
	maxDepthFactor = 2.5
	// Submarines (BDA Surface AI in Submarine mode, or parts with submarine = true)
	submarineFlowMultiplier = 0.5
	submarineMinCrushDepth = 350
	// Crush damage: fraction of max HP per second at crush depth (grows with depth beyond it)
	crushDamageRate = 0.1
	// Parts still alive after this many seconds below crush depth are destroyed
	crushFailsafeTime = 20
	// A flooding surface ship whose centre of mass is below this altitude has foundered
	founderAltitude = -20
	// Buoyancy given to crushable parts once their ship has foundered
	founderBuoyancy = 0
	// Heating (K per second per metre of depth) of hydroExplosive parts on a foundered ship
	hydroHeatRate = 5
	// Batteries in a compartment flooded beyond ecShortFraction are shorted out
	ecDrain = True
	ecShortFraction = 0.5
	// Simulation interval in seconds
	updateInterval = 0.1
	messages = True
	debug = False
}
